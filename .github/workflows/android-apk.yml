name: Android APK

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-AI-STUDIO-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as GitHub Release asset
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        shell: bash
        run: |
          TAG="apk-build-${RUN_NUMBER}"
          gh release create "$TAG" "$APK_PATH#PS-AI-STUDIO-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PS AI STUDIO APK - Build ${RUN_NUMBER}" \
            --notes "Automatically built Android debug APK from commit ${GITHUB_SHA}."
